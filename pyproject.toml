[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-data-analytics"
version = "0.1.1"
description = "Streamlit dashboard builder for Home Assistant CSV exports stored in Azure Blob Storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "azure-storage-blob>=12.19",
  "pandas>=2.1",
  "plotly>=5.18",
  "python-dotenv>=1.0",
  "streamlit>=1.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
